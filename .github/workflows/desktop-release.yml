# Desktop publishing path.
#
# Publishing model:
#   - Web:     Vercel deploys automatically on every commit (`pnpm build`).
#              This workflow never touches that path.
#   - Desktop: pushing a `v*` tag (or running this manually) builds the
#              Electron app on all three OSes and uploads installers to a
#              draft GitHub Release for review before publishing.
#
# Optional signing / notarization secrets (all builds work unsigned without them):
#   CSC_LINK, CSC_KEY_PASSWORD           - code signing cert (base64 .p12) for mac/win
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
#   APPLE_TEAM_ID                        - macOS notarization (requires CSC_LINK)

name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux

    runs-on: ${{ matrix.os }}

    env:
      # Signing / notarization (no-ops when the secrets are not configured).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Only auto-discover a signing identity when a cert is provided.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Download ffmpeg binary
        run: pnpm install-ffmpeg

      - name: Build renderer (static export)
        run: pnpm build:renderer

      # Arch targets (mac x64 + arm64, win x64) come from package.json "build".
      - name: Package and publish (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: astrofox-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
